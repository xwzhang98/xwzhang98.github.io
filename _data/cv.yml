- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: McWilliams Center for Cosmology & Astrophysics, Carnegie Mellon University
      year: 2021 to present
      description:
        - 'Super-resolution of N-body simulations across cosmic time: 512× more particles, validated on power spectra, halo mass functions, and merger trees. First author, <a href="https://doi.org/10.1093/mnras/stad3940">MNRAS</a>.'
        - 'Deterministic emulator that recovers the specific realization implied by a simulation’s initial conditions (first author, <a href="https://doi.org/10.33232/001c.129471">OJAp</a>); the same method, applied by a mentee to the Lyman-α forest, reaches sub-percent accuracy at 260× the speed of the hydrodynamic solver (second author, <a href="https://arxiv.org/abs/2507.16189">arXiv:2507.16189</a>).'
        - "Cosmology-aware super-resolution: one model for every cosmology in the Quijote suite. First author, submitted."
        - 'SimAgents, a multi-agent LLM system that configures and runs MP-GADGET simulations from the literature: 80% fewer setup errors, 83× faster setup. First author, <a href="https://doi.org/10.18653/v1/2025.ijcnlp-demo.7">IJCNLP-AACL 2025</a>.'
    - title: Research Assistant
      institution: Institute of Mathematical Sciences, ShanghaiTech University
      year: 2020 to 2021
      description:
        - Topological data analysis of high-dimensional cosmological datasets; tropical-geometry representations of neural network decision boundaries.

