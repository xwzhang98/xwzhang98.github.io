- title: Open Source Software
  type: time_table
  contents:
    - title: <a href="https://github.com/xwzhang98/CosmoSR">CosmoSR</a>
      description:
        - Generative adversarial network that super-resolves Quijote simulations at multiple cosmologies; used in the cosmology-aware super-resolution paper (submitted).
    - title: <a href="https://github.com/xwzhang98/SimAgents">SimAgents</a>
      description:
        - Multi-agent LLM framework that turns a physical setup described in the literature into a runnable MP-GADGET configuration and first-look analysis, with a validated database of simulation parameters from published suites for evaluation.
    - title: <a href="https://github.com/xwzhang98/SREmulator">SREmulator</a>
      description:
        - Neural models that transform stochastic super-resolution outputs into deterministic realizations matching specific initial conditions.
    - title: <a href="https://github.com/xwzhang98/map2map/tree/stylegan2">map2map (stylegan2)</a>
      description:
        - 'Style-conditioned super-resolution models for N-body simulations (512× mass resolution), developed on Yin Li’s map2map framework; <a href="https://github.com/eelregit/map2map/pull/8">upstream PR merged</a>, 2021.'

